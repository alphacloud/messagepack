version: .{build}
clone_folder: c:\work\messagepack

pull_requests:
  do_not_increment_build_number: true

nuget:
  disable_publish_on_pr: true

os: Visual Studio 2022

environment:
  # Set the DOTNET_SKIP_FIRST_TIME_EXPERIENCE environment variable to stop wasting time caching packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending usage data to Microsoft
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  COVERALLS_REPO_TOKEN:
    secure: PPV4OTsE0mqUJQ5UXY8dKJnifv+488XNxe7rtyUbiYJNMgvOooUZvGeSxhsOIJmJ
  CAKE_SETTINGS_SKIPVERIFICATION: true
  GITHUB_TOKEN:
    secure: SakrMxbclSjNzFQxv8sA35OhulfvNm9VqHBEOgQrebPaF/Bv7AmZRsT8/YEfSQED
  CAKE_SETTINGS_ENABLESCRIPTCACHE:
    true
  CAKE_PATHS_CACHE:
    c:\caches\cake

cache:
    - c:\caches\cake -> build\*.cake, appveyor.yml

install:
  - ps: dotnet tool install Cake.Tool --version 4.0.0 --global
  - ps: dotnet tool install coveralls.net --version 4.0.1 --global
  - ps: ./dotnet-install.ps1 -Version 9.0.100-preview.4.24267.66 -InstallDir "C:\Program Files\dotnet"


build_script:
  - ps: dotnet cake

test: off

artifacts:
  - path: artifacts/packages/*.nupkg
    name: NuGet packages

  - path: artifacts/packages/*.snupkg
    name: NuGet symbol packages
    type: NuGetPackage

deploy:
  - provider: NuGet
    name: Pre-release
    api_key:
      secure: 1M4uTClnRdSAI28aEcpp8r0k8NosWIB7EvWe1py4G41Tam7KE8H0dkSnEf7YpCgL
    on:
      branch:
        - develop
        - /release\/v.*/
        - /releases.*/
        - /hotfixes.*/

  - provider: NuGet
    name: Tagged release
    api_key:
      secure: 1M4uTClnRdSAI28aEcpp8r0k8NosWIB7EvWe1py4G41Tam7KE8H0dkSnEf7YpCgL
    on:
      appveyor_repo_tag: true
